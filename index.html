<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idrotech Varese - Area Operai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-orange-hover: #d97712;
            --brand-dark: #2d3748;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0f172a;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 460px; background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .brand-header { text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; }
        .brand-logo-text { font-size: 1.5rem; font-weight: 800; color: var(--brand-dark); margin: 0; }
        .brand-logo-text span { color: var(--brand-orange); }
        .brand-subtitle { font-size: 0.75rem; color: var(--text-light); font-style: italic; margin-top: 4px; }
        
        .home-screen { text-align: center; padding: 10px 0; }
        .home-menu-title { font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-bottom: 15px; text-transform: uppercase; }
        .home-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; font-size: 1.05rem; font-weight: 600; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-lavoro { background-color: var(--brand-orange); color: white; }
        .btn-lista { background-color: var(--brand-dark); color: white; }

        .app-section { display: none; }
        .app-section.active { display: block; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .back-btn { background: #f1f5f9; color: var(--text); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .top-title { font-size: 1rem; font-weight: 700; color: #0f172a; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; margin-top: 10px; text-transform: uppercase; }
        
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; background-color: #f8fafc; color: var(--text); font-family: 'Inter', sans-serif; }
        input[type="date"] { appearance: none; -webkit-appearance: none; background-color: #f8fafc; }

        button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-salva { background-color: var(--success); color: white; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 15px 0; }
        ul { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        li { background: #f8fafc; border: 1px solid var(--border); margin-bottom: 6px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; font-size: 0.9rem; }
        .badge { background: #ffedd5; color: #c2410c; padding: 2px 6px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
        .delete-btn { background: #fee2e2; color: var(--danger); border: none; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .preview-box { margin-top: 6px; font-size: 0.8rem; color: var(--success); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HOME OPERAI -->
        <div id="sezione-home" class="app-section active">
            <div class="brand-header">
                <h1 class="brand-logo-text">IDROTECH <span>VARESE</span></h1>
                <div class="brand-subtitle">Area Operai - Cantiere</div>
            </div>
            <div class="home-screen">
                <div class="home-menu-title">Seleziona Operazione</div>
                <button class="home-btn btn-lavoro" onclick="cambiaSezione('rapportino')">📝 Compila Foglio di Lavoro</button>
                <button class="home-btn btn-lista" onclick="cambiaSezione('lista')">📋 Lista Materiali</button>
            </div>
        </div>

        <!-- FOGLIO DI LAVORO -->
        <div id="sezione-rapportino" class="app-section">
            <div class="top-nav">
                <button class="back-btn" onclick="cambiaSezione('home')">🏠 Home</button>
                <h2 class="top-title">Foglio Lavoro</h2>
            </div>
            
            <label>Data</label>
            <input type="date" id="rapData">
            
            <label>Seleziona Cantiere</label>
            <select id="selezionaCantiere" onchange="caricaDatiCantiere()">
                <option value="">-- Seleziona cantiere --</option>
            </select>
            <input type="hidden" id="rapCliente">
            <input type="hidden" id="rapIndirizzo">

            <label>Tipo di Lavoro</label>
            <select id="rapTipoLavoro">
                <option value="Nuovo Lavoro">Nuovo Lavoro / Installazione</option>
                <option value="Continuazione">Continuazione Lavoro</option>
                <option value="Riparazione / Urgenza">Riparazione / Urgenza</option>
                <option value="Manutenzione">Manutenzione</option>
            </select>

            <label>Operai Presenti</label>
            <input type="text" id="rapOperai" placeholder="Es. Mario, Luca">

            <label>Ore Lavoro</label>
            <select id="rapOre">
                <option value="">Seleziona ore...</option>
                <option value="1 Ora">1 Ora</option>
                <option value="2 Ore">2 Ore</option>
                <option value="3 Ore">3 Ore</option>
                <option value="4 Ore">4 Ore</option>
                <option value="5 Ore">5 Ore</option>
                <option value="6 Ore">6 Ore</option>
                <option value="7 Ore">7 Ore</option>
                <option value="8 Ore">8 Ore</option>
            </select>

            <label>Note / Lavori Eseguiti</label>
            <textarea id="rapNote" rows="2" placeholder="Descrivi il lavoro fatto..."></textarea>

            <label>Foto Bolla / Documento</label>
            <input type="file" id="fotoBolla" accept="image/*" capture="environment" style="display:none;" onchange="mostraStatoFoto()">
            <button class="btn-secondary" onclick="document.getElementById('fotoBolla').click()" style="background:#e0f2fe; color:#0369a1; border: 1px dashed #7dd3fc; margin-top: 4px;">📷 Allega Foto Bolla / Documento</button>
            <div id="statoFoto" class="preview-box" style="display:none;"></div>

            <button class="btn-salva" onclick="salvaRapportinoUfficio()">💾 Salva Rapportino e Invia all'Ufficio</button>
            <button class="btn-secondary" onclick="segnalaConcluso()">✅ Segna Cantiere Concluso</button>
        </div>

        <!-- LISTA MATERIALI -->
        <div id="sezione-lista" class="app-section">
            <div class="top-nav">
                <button class="back-btn" onclick="cambiaSezione('home')">🏠 Home</button>
                <h2 class="top-title">Lista Materiali</h2>
            </div>
            
            <label>Riferimento Cantiere</label>
            <input type="text" id="nomeCantiere" placeholder="Nome cantiere">

            <label>Categoria</label>
            <select id="categoriaSelect" onchange="aggiornaMateriali()">
                <option value="">Seleziona categoria...</option>
            </select>

            <label>Articolo</label>
            <select id="materialeSelect">
                <option value="">Prima seleziona categoria...</option>
            </select>

            <label>Quantità</label>
            <input type="number" id="quantitaInput" value="1" min="1">

            <button class="btn-salva" onclick="aggiungiMateriale()" style="background:var(--brand-orange); margin-top: 12px;">Aggiungi alla Lista</button>
            <hr>
            <ul id="listaSpesa"></ul>
            <button class="btn-salva" onclick="inviaListaWhatsApp()">Invia Lista su WhatsApp</button>
            <button class="btn-secondary" onclick="pulisciLista()">Svuota</button>
        </div>
    </div>

    <script>
        function cambiaSezione(id) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sezione-' + id).classList.add('active');
            if(id === 'rapportino') aggiornaTendinaCantieri();
        }

        let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];

        function aggiornaTendinaCantieri() {
            const select = document.getElementById('selezionaCantiere');
            select.innerHTML = '<option value="">-- Seleziona cantiere --</option>';
            cantieriDB.forEach((c, index) => {
                if(c.stato !== 'Concluso') {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = `${c.cliente} - ${c.indirizzo}`;
                    select.appendChild(opt);
                }
            });
        }

        function caricaDatiCantiere() {
            const index = document.getElementById('selezionaCantiere').value;
            if(index !== "") {
                document.getElementById('rapCliente').value = cantieriDB[index].cliente;
                document.getElementById('rapIndirizzo').value = cantieriDB[index].indirizzo;
            }
        }

        function mostraStatoFoto() {
            const input = document.getElementById('fotoBolla');
            const stato = document.getElementById('statoFoto');
            if(input.files && input.files[0]) {
                stato.style.display = 'block';
                stato.innerHTML = `✅ Foto allegata: ${input.files[0].name}`;
            }
        }

        function segnalaConcluso() {
            const index = document.getElementById('selezionaCantiere').value;
            if(index === "") return alert("Seleziona un cantiere!");
            if(confirm("Segnare il cantiere come concluso?")) {
                cantieriDB[index].stato = 'Concluso';
                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
                alert("Cantiere chiuso e aggiornato nel pannello ufficio!");
                cambiaSezione('home');
            }
        }

        const database = {
            "Tubi Multistrato": ["Tubo 16x2", "Tubo 20x2", "Tubo 26x3"],
            "Raccordi": ["Raccordo 16x1/2\"", "Gomito 16x1/2\"", "Tee 16-16-16"]
        };

        const catSelect = document.getElementById('categoriaSelect');
        const matSelect = document.getElementById('materialeSelect');
        let lista = [];

        window.onload = function() {
            document.getElementById('rapData').valueAsDate = new Date();
            for (const cat in database) {
                let opt = document.createElement('option'); 
                opt.value = cat; 
                opt.innerHTML = cat;
                catSelect.appendChild(opt);
            }
        };

        function aggiornaMateriali() {
            matSelect.innerHTML = '<option value="">Seleziona...</option>';
            if(database[catSelect.value]) {
                database[catSelect.value].forEach(m => {
                    let opt = document.createElement('option'); 
                    opt.value = m; 
                    opt.innerHTML = m;
                    matSelect.appendChild(opt);
                });
            }
        }

        function aggiungiMateriale() {
            if(matSelect.value) {
                lista.push({nome: matSelect.value, qta: document.getElementById('quantitaInput').value});
                document.getElementById('listaSpesa').innerHTML = lista.map((i, idx) => `
                    <li>
                        <span><span class='badge'>${i.qta}x</span> ${i.nome}</span> 
                        <button class='delete-btn' onclick='lista.splice(${idx},1);this.parentNode.remove()'>✕</button>
                    </li>
                `).join('');
            }
        }

        function pulisciLista() {
            lista = [];
            document.getElementById('listaSpesa').innerHTML = '';
        }

        function inviaListaWhatsApp() {
            if(lista.length === 0) return alert("Lista vuota");
            let text = `📋 Lista Materiali (${document.getElementById('nomeCantiere').value || 'Cantiere'})\n` + lista.map(i => `• ${i.qta}x ${i.nome}`).join('\n');
            window.open(`https://wa.me/?text=` + encodeURIComponent(text));
        }

        function salvaRapportinoUfficio() {
            let cliente = document.getElementById('rapCliente').value;
            if(!cliente) return alert("Seleziona un cantiere valido!");
            
            let dataLavoro = document.getElementById('rapData').value;
            let tipoLavoro = document.getElementById('rapTipoLavoro').value;
            let operai = document.getElementById('rapOperai').value || 'Non specificato';
            let ore = document.getElementById('rapOre').value;
            let note = document.getElementById('rapNote').value;
            let fotoInput = document.getElementById('fotoBolla');
            let haFoto = (fotoInput.files && fotoInput.files.length > 0);

            let indexCantiere = document.getElementById('selezionaCantiere').value;
            if(indexCantiere !== "") {
                if(!cantieriDB[indexCantiere].storico) cantieriDB[indexCantiere].storico = [];
                cantieriDB[indexCantiere].storico.push({
                    data: dataLavoro,
                    tipo: tipoLavoro,
                    operai: operai,
                    ore: ore,
                    note: note,
                    bolla: haFoto ? "📎 Bolla allegata" : "Nessuna bolla"
                });
                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            }

            alert("✅ Rapportino salvato con successo e inviato allo storico dell'ufficio!");
            
            // Pulisce il form e torna alla home
            document.getElementById('rapOperai').value = '';
            document.getElementById('rapNote').value = '';
            document.getElementById('fotoBolla').value = '';
            document.getElementById('statoFoto').style.display = 'none';
            cambiaSezione('home');
        }
    </script>
</body>
</html>
