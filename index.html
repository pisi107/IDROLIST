<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idrotech Varese - Area Operai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0b0f19;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        
        .header-app { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 25px 20px 20px 20px; text-align: center; border-bottom: 4px solid var(--brand-orange); }
        .header-app h1 { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
        .header-app h1 span { color: var(--brand-orange); }
        .header-app p { font-size: 0.8rem; color: #94a3b8; margin: 6px 0 0 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .content-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

        .home-menu { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .big-menu-btn { display: flex; align-items: center; padding: 22px 20px; border-radius: 16px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-align: left; gap: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .btn-lavoro-bg { background: linear-gradient(135deg, #f28c1e, #d97712); color: white; }
        .btn-lista-bg { background: linear-gradient(135deg, #334155, #1e293b); color: white; }
        .big-menu-btn span { font-size: 1.8rem; }

        .app-section { display: none; }
        .app-section.active { display: flex; flex-direction: column; gap: 14px; }

        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 4px; }
        .nav-back { background: #f1f5f9; color: var(--text); border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .nav-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        
        input, select, textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; background-color: #f8fafc; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
        input[type="date"] { appearance: none; -webkit-appearance: none; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1); margin-top: 10px; }
        .btn-green { background-color: var(--success); color: white; }
        .btn-blue-light { background-color: #e0f2fe; color: #0369a1; border: 2px dashed #38bdf8; }
        
        .grid-anteprime { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .thumb-container { position: relative; width: 70px; height: 70px; border-radius: 8px; overflow: hidden; border: 2px solid #bbf7d0; background: #f0fdf4; }
        .thumb-container img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-delete { position: absolute; top: 2px; right: 2px; background: rgba(220, 38, 38, 0.9); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        ul { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        li { background: #f8fafc; border: 1px solid var(--border); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; font-size: 0.95rem; }
        .badge { background: #ffedd5; color: #c2410c; padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 800; }
        .delete-btn { background: #fee2e2; color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-app">
            <h1>IDROTECH <span>VARESE</span></h1>
            <p>Pannello Operativo Cantieri</p>
        </div>

        <div class="content-body">
            <!-- HOME OPERAI -->
            <div id="sezione-home" class="app-section active">
                <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-light); text-align: center; margin-top: 10px; text-transform: uppercase;">Seleziona Operazione</div>
                <div class="home-menu">
                    <button class="big-menu-btn btn-lavoro-bg" onclick="cambiaSezione('rapportino')">
                        <span>📝</span>
                        <div>
                            <div>Compila Foglio di Lavoro</div>
                            <div style="font-size: 0.75rem; font-weight: 400; opacity: 0.85; margin-top: 3px;">Rapportino, ore e chiusura cantiere</div>
                        </div>
                    </button>
                    <button class="big-menu-btn btn-lista-bg" onclick="cambiaSezione('lista')">
                        <span>📋</span>
                        <div>
                            <div>Lista Materiali</div>
                            <div style="font-size: 0.75rem; font-weight: 400; opacity: 0.85; margin-top: 3px;">Preleva tubi, raccordi e invia lista</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- FOGLIO DI LAVORO -->
            <div id="sezione-rapportino" class="app-section">
                <div class="top-nav-bar">
                    <button class="nav-back" onclick="cambiaSezione('home')">🏠 Home</button>
                    <h2 class="nav-title">Foglio Lavoro</h2>
                </div>
                
                <div>
                    <label>Data Intervento</label>
                    <input type="date" id="rapData">
                </div>
                
                <div>
                    <label>Ricerca Rapida Cantiere</label>
                    <input type="text" id="filtroCantiere" placeholder="🔍 Digita nome cliente o indirizzo..." oninput="filtraCantieri()">
                </div>

                <div>
                    <label>Seleziona Cantiere</label>
                    <select id="selezionaCantiere">
                        <option value="">-- Seleziona cantiere --</option>
                    </select>
                </div>

                <div>
                    <label>Tipo di Lavoro</label>
                    <select id="rapTipoLavoro">
                        <option value="Nuovo Lavoro">Nuovo Lavoro / Installazione</option>
                        <option value="Continuazione">Continuazione Lavoro</option>
                        <option value="Riparazione / Urgenza">Riparazione / Urgenza</option>
                        <option value="Manutenzione">Manutenzione</option>
                    </select>
                </div>

                <div>
                    <label>Operai Presenti</label>
                    <input type="text" id="rapOperai" placeholder="Es. Mario, Luca">
                </div>

                <div>
                    <label>Ore Lavoro</label>
                    <select id="rapOre">
                        <option value="">Seleziona ore...</option>
                        <option value="1 Ora">1 Ora</option>
                        <option value="2 Ore">2 Ore</option>
                        <option value="3 Ore">3 Ore</option>
                        <option value="4 Ore">4 Ore</option>
                        <option value="5 Ore">5 Ore</option>
                        <option value="6 Ore">6 Ore</option>
                        <option value="7 Ore">7 Ore</option>
                        <option value="8 Ore">8 Ore</option>
                    </select>
                </div>

                <div>
                    <label>Note / Lavori Eseguiti</label>
                    <textarea id="rapNote" rows="3" placeholder="Descrivi il lavoro fatto..."></textarea>
                </div>

                <!-- SEZIONE FOTO BOLLA MULTIPLE -->
                <div>
                    <label>Foto Bolla / Documento (Aggiungi quante ne vuoi)</label>
                    <input type="file" id="inputFotoBolla" accept="image/*" style="display:none;" onchange="comprimiEggiungiFoto(this, 'bolla')">
                    <button class="action-btn btn-blue-light" onclick="document.getElementById('inputFotoBolla').click()" style="margin:0; font-size:0.9rem;">📎 + Aggiungi Foto Bolla</button>
                    <div id="containerBolle" class="grid-anteprime"></div>
                </div>

                <!-- SEZIONE FOTO LAVORO MULTIPLE -->
                <div style="margin-top: 5px;">
                    <label>Foto Lavoro Eseguito (Aggiungi quante ne vuoi)</label>
                    <input type="file" id="inputFotoLavoro" accept="image/*" style="display:none;" onchange="comprimiEggiungiFoto(this, 'lavoro')">
                    <button class="action-btn btn-blue-light" onclick="document.getElementById('inputFotoLavoro').click()" style="margin:0; font-size:0.9rem;">📸 + Aggiungi Foto Lavoro</button>
                    <div id="containerLavori" class="grid-anteprime"></div>
                </div>

                <button class="action-btn btn-green" onclick="salvaEConcludiCantiere()" style="margin-top: 15px;">✅ Salva e Invia Rapportino</button>
            </div>

            <!-- LISTA MATERIALI -->
            <div id="sezione-lista" class="app-section">
                <div class="top-nav-bar">
                    <button class="nav-back" onclick="cambiaSezione('home')">🏠 Home</button>
                    <h2 class="nav-title">Lista Materiali</h2>
                </div>
                
                <div>
                    <label>Riferimento Cantiere</label>
                    <input type="text" id="nomeCantiere" placeholder="Nome cantiere">
                </div>

                <div>
                    <label>Categoria</label>
                    <select id="categoriaSelect" onchange="aggiornaMateriali()">
                        <option value="">Seleziona categoria...</option>
                    </select>
                </div>

                <div>
                    <label>Articolo</label>
                    <select id="materialeSelect">
                        <option value="">Prima seleziona categoria...</option>
                    </select>
                </div>

                <div>
                    <label>Quantità</label>
                    <input type="number" id="quantitaInput" value="1" min="1">
                </div>

                <button class="action-btn" onclick="aggiungiMateriale()" style="background:var(--brand-orange); color:white; margin-top:0;">Aggiungi alla Lista</button>
                
                <hr style="border:0; border-top:2px solid #f1f5f9; margin: 10px 0;">
                
                <ul id="listaSpesa"></ul>
                
                <button class="action-btn btn-green" onclick="inviaListaWhatsApp()" style="margin-top:5px;">Invia Lista su WhatsApp</button>
                <button class="action-btn btn-gray" onclick="pulisciLista()" style="margin-top:5px;">Svuota Lista</button>
            </div>
        </div>
    </div>

    <script>
        function cambiaSezione(id) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sezione-' + id).classList.add('active');
            if(id === 'rapportino') {
                document.getElementById('filtroCantiere').value = '';
                aggiornaTendinaCantieri();
            }
        }

        let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
        let fotoBolleArray = [];
        let fotoLavoriArray = [];

        function aggiornaTendinaCantieri(filtro = '') {
            cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            const select = document.getElementById('selezionaCantiere');
            select.innerHTML = '<option value="">-- Seleziona cantiere --</option>';
            
            let testoFiltro = filtro.toLowerCase();

            cantieriDB.forEach((c, index) => {
                let stringaCantiere = `${c.cliente} - ${c.indirizzo}`.toLowerCase();
                
                // Se corrisponde alla ricerca (o se la ricerca è vuota)
                if(stringaCantiere.includes(testoFiltro)) {
                    let opt = document.createElement('option');
                    opt.value = index;
                    let numInterventi = c.storico ? c.storico.length : 0;
                    opt.textContent = `${c.cliente} - ${c.indirizzo} (${numInterventi} int.)`;
                    select.appendChild(opt);
                }
            });
        }

        function filtraCantieri() {
            let val = document.getElementById('filtroCantiere').value;
            aggiornaTendinaCantieri(val);
        }

        // Compressione automatica immagini per evitare blocchi su iOS
        function comprimiEggiungiFoto(input, tipo) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let maxWidth = 900;
                        let scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        if (tipo === 'bolla') {
                            fotoBolleArray.push(compressedDataUrl);
                            renderizzaMiniature('bolla');
                        } else {
                            fotoLavoriArray.push(compressedDataUrl);
                            renderizzaMiniature('lavoro');
                        }
                        input.value = '';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function rimuoviFoto(tipo, index) {
            if (tipo === 'bolla') {
                fotoBolleArray.splice(index, 1);
                renderizzaMiniature('bolla');
            } else {
                fotoLavoriArray.splice(index, 1);
                renderizzaMiniature('lavoro');
            }
        }

        function renderizzaMiniature(tipo) {
            let containerId = tipo === 'bolla' ? 'containerBolle' : 'containerLavori';
            let container = document.getElementById(containerId);
            let arrayDati = tipo === 'bolla' ? fotoBolleArray : fotoLavoriArray;

            container.innerHTML = '';
            arrayDati.forEach((imgSrc, idx) => {
                container.innerHTML += `
                    <div class="thumb-container">
                        <img src="${imgSrc}" alt="Anteprima">
                        <button class="thumb-delete" onclick="rimuoviFoto('${tipo}', ${idx})">✕</button>
                    </div>
                `;
            });
        }

        const database = {
            "Tubi Multistrato": ["Tubo 16x2", "Tubo 20x2", "Tubo 26x3"],
            "Raccordi": ["Raccordo 16x1/2\"", "Gomito 16x1/2\"", "Tee 16-16-16"]
        };

        const catSelect = document.getElementById('categoriaSelect');
        const matSelect = document.getElementById('materialeSelect');
        let lista = [];

        window.onload = function() {
            document.getElementById('rapData').valueAsDate = new Date();
            for (const cat in database) {
                let opt = document.createElement('option'); 
                opt.value = cat; 
                opt.innerHTML = cat;
                catSelect.appendChild(opt);
            }
        };

        function aggiornaMateriali() {
            matSelect.innerHTML = '<option value="">Seleziona...</option>';
            if(database[catSelect.value]) {
                database[catSelect.value].forEach(m => {
                    let opt = document.createElement('option'); 
                    opt.value = m; 
                    opt.innerHTML = m;
                    matSelect.appendChild(opt);
                });
            }
        }

        function aggiungiMateriale() {
            if(matSelect.value) {
                lista.push({nome: matSelect.value, qta: document.getElementById('quantitaInput').value});
                document.getElementById('listaSpesa').innerHTML = lista.map((i, idx) => `
                    <li>
                        <span><span class='badge'>${i.qta}x</span> ${i.nome}</span> 
                        <button class='delete-btn' onclick='lista.splice(${idx},1);this.parentNode.remove()'>✕</button>
                    </li>
                `).join('');
            }
        }

        function pulisciLista() {
            lista = [];
            document.getElementById('listaSpesa').innerHTML = '';
        }

        function inviaListaWhatsApp() {
            if(lista.length === 0) return alert("Lista vuota");
            let text = `📋 Lista Materiali (${document.getElementById('nomeCantiere').value || 'Cantiere'})\n` + lista.map(i => `• ${i.qta}x ${i.nome}`).join('\n');
            window.open(`https://wa.me/?text=` + encodeURIComponent(text));
        }

        function salvaEConcludiCantiere() {
            let indexCantiere = document.getElementById('selezionaCantiere').value;
            if(indexCantiere === "") return alert("Seleziona un cantiere dalla lista!");
            
            if(!cantieriDB[indexCantiere].storico) {
                cantieriDB[indexCantiere].storico = [];
            }

            cantieriDB[indexCantiere].storico.push({
                data: document.getElementById('rapData').value,
                tipo: document.getElementById('rapTipoLavoro').value,
                operai: document.getElementById('rapOperai').value || 'Non specificato',
                ore: document.getElementById('rapOre').value || 'Non specificate',
                note: document.getElementById('rapNote').value,
                fotoBolle: [...fotoBolleArray],
                fotoLavori: [...fotoLavoriArray]
            });
            
            cantieriDB[indexCantiere].stato = 'Aggiornato';
            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));

            alert("✅ Rapportino salvato con successo!");
            
            // Pulisci i campi e gli array
            fotoBolleArray = [];
            fotoLavoriArray = [];
            document.getElementById('containerBolle').innerHTML = '';
            document.getElementById('containerLavori').innerHTML = '';
            document.getElementById('rapOperai').value = '';
            document.getElementById('rapNote').value = '';
            document.getElementById('filtroCantiere').value = '';
            
            cambiaSezione('home');
        }
    </script>
</body>
</html>
