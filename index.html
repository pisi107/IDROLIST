<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idrotech Varese - Gestione Operaio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0b0f19;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        
        .header-app { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 25px 20px 20px 20px; text-align: center; border-bottom: 4px solid var(--brand-orange); }
        .header-app h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .header-app h1 span { color: var(--brand-orange); }
        .header-app p { font-size: 0.75rem; color: #94a3b8; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .content-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

        .app-section { display: none; }
        .app-section.active { display: flex; flex-direction: column; gap: 14px; }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; background-color: #f8fafc; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
        input[type="date"] { appearance: none; -webkit-appearance: none; }
        input[type="file"] { padding: 10px; font-size: 0.85rem; background: #fff; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .btn-green { background-color: var(--success); color: white; }
        .btn-orange { background: linear-gradient(135deg, #f28c1e, #d97712); color: white; }

        .banner-ore-mancanti { background: #fef2f2; border: 2px solid #ef4444; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .banner-title { font-size: 0.95rem; font-weight: 800; color: #b91c1c; display: flex; align-items: center; gap: 6px; }
        .banner-text { font-size: 0.85rem; color: #7f1d1d; line-height: 1.4; }

        .card-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .collega-card-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .collega-card-item label { margin: 0; font-size: 0.9rem; color: var(--text); text-transform: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .collega-card-item input[type="checkbox"] { width: 18px; height: 18px; }
        .collega-card-item select { width: 110px; padding: 8px; font-size: 0.9rem; }
        
        .container-colleghi-scroll { max-height: 220px; overflow-y: auto; background: #fff; padding: 8px; border: 1px solid var(--border); border-radius: 10px; }
        
        .preview-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .preview-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-app">
            <h1>IDROTECH <span>VARESE</span></h1>
            <p>Portale Dipendenti - Foglio Lavoro</p>
        </div>

        <div class="content-body">
            <!-- 1. SEZIONE LOGIN -->
            <div id="sezione-login" class="app-section active">
                <div class="card-box" style="margin-top: 10px;">
                    <div style="font-size: 1.1rem; font-weight: 800; color: var(--brand-dark); text-align: center;">Autenticazione Dipendente</div>
                    <div>
                        <label>Seleziona il tuo Profilo</label>
                        <select id="selettoreOperaio">
                            <option value="">-- Seleziona il tuo nome --</option>
                            <option value="Assali Luca">Assali Luca</option>
                            <option value="Bruno Nicola">Bruno Nicola</option>
                            <option value="Comolli Alessandro">Comolli Alessandro</option>
                            <option value="Concato Filippo">Concato Filippo</option>
                            <option value="Coriglione Alessandro">Coriglione Alessandro</option>
                            <option value="De Bosio Marcello">De Bosio Marcello</option>
                            <option value="Denti Claudio">Denti Claudio</option>
                            <option value="Doda Enjo">Doda Enjo</option>
                            <option value="Giaccone Federico">Giaccone Federico</option>
                            <option value="Gjyly Moris">Gjyly Moris</option>
                            <option value="Marinoni Alessandro">Marinoni Alessandro</option>
                            <option value="Rocchetto Fabio">Rocchetto Fabio</option>
                            <option value="Rosini Jean Paul">Rosini Jean Paul</option>
                            <option value="Saleh Mohamed">Saleh Mohamed</option>
                        </select>
                    </div>
                    <div>
                        <label>Password</label>
                        <input type="password" id="inputPassword" placeholder="Inserisci la password">
                    </div>
                    <button class="action-btn btn-orange" onclick="effettuaLogin()" style="margin-top: 5px;">Accedi</button>
                </div>
            </div>

            <!-- 2. SEZIONE CAMBIO PASSWORD -->
            <div id="sezione-cambio-password" class="app-section">
                <div class="card-box" style="margin-top: 10px; border-color: var(--brand-orange);">
                    <div style="font-size: 1.1rem; font-weight: 800; color: var(--brand-dark); text-align: center;">Modifica Password Obbligatoria</div>
                    <div>
                        <label>Nuova Password Personale</label>
                        <input type="password" id="nuovaPassword1" placeholder="Nuova password">
                    </div>
                    <div>
                        <label>Conferma Nuova Password</label>
                        <input type="password" id="nuovaPassword2" placeholder="Ripeti password">
                    </div>
                    <button class="action-btn btn-orange" onclick="salvaNuovaPassword()" style="margin-top: 5px;">Salva e Accedi</button>
                </div>
            </div>

            <!-- 3. SEZIONE DASHBOARD / FOGLIO LAVORO COMPLETO -->
            <div id="sezione-dashboard" class="app-section">
                <div style="display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);">
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-light); font-weight: 700; text-transform: uppercase;">Utente Collegato</div>
                        <div id="labelUtenteCorrente" style="font-size: 1rem; font-weight: 800; color: var(--brand-dark);"></div>
                    </div>
                    <button onclick="esciProfilo()" style="background: #fee2e2; color: var(--danger); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer;">Esci</button>
                </div>

                <!-- BOX NOTIFICA ORE MANCANTI -->
                <div id="boxNotificaOrePersonale"></div>

                <div class="card-box">
                    <div style="font-size: 1.05rem; font-weight: 800; color: var(--brand-dark);">📝 Compila Foglio di Lavoro</div>
                    
                    <div>
                        <label>Seleziona Cantiere</label>
                        <select id="selectCantiereOperaio"></select>
                    </div>

                    <div>
                        <label>Stato Cantiere per questo Intervento</label>
                        <select id="selectStatoIntervento">
                            <option value="Da terminare">Cantiere Da Terminare</option>
                            <option value="Terminato">Cantiere Terminato</option>
                        </select>
                    </div>

                    <div>
                        <label>Data Intervento</label>
                        <input type="date" id="dataIntervento">
                    </div>

                    <div>
                        <label>Tipo di Lavoro</label>
                        <select id="tipoLavoroOperaio">
                            <option value="Nuovo Lavoro / Installazione">Nuovo Lavoro / Installazione</option>
                            <option value="Manutenzione / Riparazione">Manutenzione / Riparazione</option>
                            <option value="Sopralluogo / Preventivo">Sopralluogo / Preventivo</option>
                            <option value="Assenza (Ferie/Malattia)">Assenza (Ferie/Malattia)</option>
                        </select>
                    </div>

                    <div>
                        <label>Le Tue Ore Lavorate</label>
                        <select id="selectOreUtentePrincipale"></select>
                    </div>

                    <div>
                        <label>Colleghi Presenti e Ore Dedicate</label>
                        <div class="container-colleghi-scroll" id="listaColleghiConOre"></div>
                    </div>

                    <div>
                        <label>Note / Lavori Eseguiti</label>
                        <textarea id="noteIntervento" rows="3" placeholder="Descrivi il lavoro fatto..."></textarea>
                    </div>

                    <!-- SEZIONE FOTO BOLLA E FOTO LAVORI -->
                    <div style="background: #fff; padding: 12px; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label>📷 Foto Bolla (1 o più)</label>
                            <input type="file" id="fotoBollaInput" accept="image/*" multiple onchange="mostraAnteprima(this, 'previewBolla')">
                            <div id="previewBolla" class="preview-container"></div>
                        </div>

                        <div>
                            <label>📸 Foto Lavori Eseguiti (Più foto)</label>
                            <input type="file" id="fotoLavoriInput" accept="image/*" multiple onchange="mostraAnteprima(this, 'previewLavori')">
                            <div id="previewLavori" class="preview-container"></div>
                        </div>
                    </div>

                    <button class="action-btn btn-green" onclick="salvaFoglioLavoroOperaio()" style="margin-top: 10px;">Salva e Invia Rapportino</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const elencoOperaiTotali = [
            "Assali Luca", "Bruno Nicola", "Comolli Alessandro", "Concato Filippo", 
            "Coriglione Alessandro", "De Bosio Marcello", "Denti Claudio", "Doda Enjo", 
            "Giaccone Federico", "Gjyly Moris", "Marinoni Alessandro", "Rocchetto Fabio", 
            "Rosini Jean Paul", "Saleh Mohamed"
        ];

        let utenteCorrente = localStorage.getItem('idra_utente_corrente') || '';

        window.onload = function() {
            document.getElementById('dataIntervento').value = new Date().toISOString().split('T')[0];
            popolaSelectOre('selectOreUtentePrincipale');
            
            if (utenteCorrente) {
                let dbPassword = JSON.parse(localStorage.getItem('idra_db_password')) || {};
                if (dbPassword[utenteCorrente] && dbPassword[utenteCorrente].deveCambiare) {
                    mostraCambioPassword(utenteCorrente);
                } else {
                    avviaDashboard(utenteCorrente);
                }
            }
        };

        function popolaSelectOre(elementId, valoreDefault = 8) {
            let select = document.getElementById(elementId);
            if (!select) return;
            select.innerHTML = '';
            for (let i = 0.5; i <= 10; i += 0.5) {
                let selected = (i === valoreDefault) ? 'selected' : '';
                select.innerHTML += `<option value="${i}" ${selected}>${i} ${i === 1 ? 'Ora' : 'Ore'}</option>`;
            }
        }

        function getPasswordIniziale(nome) {
            return nome.toLowerCase().replace(/\s+/g, '');
        }

        function effettuaLogin() {
            let select = document.getElementById('selettoreOperaio');
            let nome = select.value;
            let passwordInput = document.getElementById('inputPassword').value.trim();

            if(!nome) return alert("Seleziona il tuo nome dalla lista!");
            if(!passwordInput) return alert("Inserisci la password!");

            let dbPassword = JSON.parse(localStorage.getItem('idra_db_password')) || {};
            let datiUtente = dbPassword[nome];
            let pwdSalvata = datiUtente ? datiUtente.password : getPasswordIniziale(nome);
            let deveCambiare = datiUtente ? datiUtente.deveCambiare : true;

            if (passwordInput === pwdSalvata) {
                document.getElementById('inputPassword').value = '';
                if (deveCambiare) {
                    mostraCambioPassword(nome);
                } else {
                    localStorage.setItem('idra_utente_corrente', nome);
                    utenteCorrente = nome;
                    avviaDashboard(nome);
                }
            } else {
                alert("❌ Password errata!");
            }
        }

        function mostraCambioPassword(nome) {
            window.tempNomeCambioPwd = nome;
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sezione-cambio-password').classList.add('active');
        }

        function salvaNuovaPassword() {
            let p1 = document.getElementById('nuovaPassword1').value.trim();
            let p2 = document.getElementById('nuovaPassword2').value.trim();
            let nome = window.tempNomeCambioPwd;

            if(!p1 || !p2) return alert("Compila entrambi i campi!");
            if(p1 !== p2) return alert("Le password non coincidono!");
            if(p1.length < 4) return alert("La password deve essere di almeno 4 caratteri.");

            let dbPassword = JSON.parse(localStorage.getItem('idra_db_password')) || {};
            dbPassword[nome] = { password: p1, deveCambiare: false };
            localStorage.setItem('idra_db_password', JSON.stringify(dbPassword));

            document.getElementById('nuovaPassword1').value = '';
            document.getElementById('nuovaPassword2').value = '';
            localStorage.setItem('idra_utente_corrente', nome);
            utenteCorrente = nome;
            alert("✅ Password aggiornata con successo!");
            avviaDashboard(nome);
        }

        function esciProfilo() {
            localStorage.removeItem('idra_utente_corrente');
            utenteCorrente = '';
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sezione-login').classList.add('active');
        }

        function avviaDashboard(nome) {
            document.getElementById('labelUtenteCorrente').innerText = nome;
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sezione-dashboard').classList.add('active');
            
            caricaCantieriPerOperaio();
            popolaColleghiConOre(nome);
            verificaOreMancantiPersonali(nome);
        }

        function caricaCantieriPerOperaio() {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let select = document.getElementById('selectCantiereOperaio');
            select.innerHTML = '';

            if (cantieriDB.length === 0) {
                select.innerHTML = '<option value="">Nessun cantiere disponibile</option>';
                return;
            }

            cantieriDB.forEach((c, idx) => {
                select.innerHTML += `<option value="${idx}">${c.cliente} - ${c.indirizzo} (${c.completato ? 'Terminato' : 'Da terminare'})</option>`;
            });
        }

        function popolaColleghiConOre(utenteEscluso) {
            let container = document.getElementById('listaColleghiConOre');
            container.innerHTML = '';

            elencoOperaiTotali.forEach(op => {
                if (op !== utenteEscluso) {
                    let idSelect = `ore_collega_${op.replace(/\s+/g, '_')}`;
                    let optionsHtml = '';
                    for (let i = 0.5; i <= 10; i += 0.5) {
                        let sel = (i === 8) ? 'selected' : '';
                        optionsHtml += `<option value="${i}" ${sel}>${i} ${i === 1 ? 'Ora' : 'Ore'}</option>`;
                    }

                    container.innerHTML += `
                        <div class="collega-card-item">
                            <label>
                                <input type="checkbox" name="collegaCheckbox" value="${op}" onchange="toggleSelectCollega('${idSelect}', this)">
                                ${op}
                            </label>
                            <select id="${idSelect}" disabled>
                                ${optionsHtml}
                            </select>
                        </div>
                    `;
                }
            });
        }

        function toggleSelectCollega(idSelect, checkbox) {
            let selectEl = document.getElementById(idSelect);
            if (selectEl) {
                selectEl.disabled = !checkbox.checked;
            }
        }

        function mostraAnteprima(input, containerId) {
            let container = document.getElementById(containerId);
            container.innerHTML = '';
            if (input.files) {
                Array.from(input.files).forEach(file => {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        container.innerHTML += `<img src="${e.target.result}" class="preview-thumb">`;
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        function verificaOreMancantiPersonali(nomeOperaio) {
            const dipendentiSenzaNotifiche = ["Bruno Nicola", "Coriglione Alessandro", "Marinoni Alessandro"];
            if (dipendentiSenzaNotifiche.includes(nomeOperaio)) {
                document.getElementById('boxNotificaOrePersonale').innerHTML = '';
                return;
            }

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let assenzeDB = JSON.parse(localStorage.getItem('idra_assenze_db')) || {};
            let oggi = new Date();
            let notificheHtml = '';

            for (let i = 0; i < 2; i++) {
                let d = new Date();
                d.setDate(oggi.getDate() - i);
                let dataStr = d.toISOString().split('T')[0];

                let chiaveAssenza = `${nomeOperaio}_${dataStr}`;
                let eAssente = assenzeDB[chiaveAssenza] === true;

                if (!eAssente) {
                    let oreTotData = 0;
                    cantieriDB.forEach(c => {
                        if (c.storico) {
                            c.storico.forEach(s => {
                                if (s.data === dataStr && s.operai && s.operai.includes(nomeOperaio)) {
                                    let matchOre = s.operai.match(new RegExp(`${nomeOperaio} \\((.*?h)\\)`));
                                    if (matchOre && matchOre[1]) {
                                        let val = parseFloat(matchOre[1]);
                                        if (!isNaN(val)) oreTotData += val;
                                    } else {
                                        oreTotData += 4;
                                    }
                                }
                            });
                        }
                    });

                    if (oreTotData < 8) {
                        let oreMancanti = 8 - oreTotData;
                        notificheHtml += `
                            <div class="banner-ore-mancanti">
                                <div class="banner-title">⚠️ Attenzione: Ore Mancanti</div>
                                <div class="banner-text">Per la giornata del <b>${dataStr}</b> hai registrato ${oreTotData} ore su 8.<br>Ti mancano esattamente <b>${oreMancanti} ore</b>.</div>
                            </div>
                        `;
                    }
                }
            }
            document.getElementById('boxNotificaOrePersonale').innerHTML = notificheHtml;
        }

        function salvaFoglioLavoroOperaio() {
            let cantiereIdx = document.getElementById('selectCantiereOperaio').value;
            let statoIntervento = document.getElementById('selectStatoIntervento').value;
            let data = document.getElementById('dataIntervento').value;
            let tipoLavoro = document.getElementById('tipoLavoroOperaio').value;
            let oreUtente = parseFloat(document.getElementById('selectOreUtentePrincipale').value) || 8;
            let note = document.getElementById('noteIntervento').value.trim();

            if (cantiereIdx === '') return alert("Seleziona un cantiere valido!");
            if (!data) return alert("Inserisci una data valida!");

            let stringaOperai = `${utenteCorrente} (${oreUtente}h)`;

            document.querySelectorAll('input[name="collegaCheckbox"]:checked').forEach(cb => {
                let nomeCollega = cb.value;
                let idSelect = `ore_collega_${nomeCollega.replace(/\s+/g, '_')}`;
                let selectOreCollega = document.getElementById(idSelect);
                let oreCollega = selectOreCollega ? parseFloat(selectOreCollega.value) || 8 : 8;
                
                stringaOperai += `, ${nomeCollega} (${oreCollega}h)`;
            });

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let assenzeDB = JSON.parse(localStorage.getItem('idra_assenze_db')) || {};
            let chiaveAssenza = `${utenteCorrente}_${data}`;

            if (tipoLavoro.includes('Assenza')) {
                assenzeDB[chiaveAssenza] = true;
                localStorage.setItem('idra_assenze_db', JSON.stringify(assenzeDB));
                alert(`✅ Giornata del ${data} registrata come Assenza.`);
            } else {
                if (assenzeDB[chiaveAssenza]) {
                    delete assenzeDB[chiaveAssenza];
                    localStorage.setItem('idra_assenze_db', JSON.stringify(assenzeDB));
                }

                if (!cantieriDB[cantiereIdx].storico) {
                    cantieriDB[cantiereIdx].storico = [];
                }

                cantieriDB[cantiereIdx].completato = (statoIntervento === "Terminato");

                cantieriDB[cantiereIdx].storico.push({
                    data: data,
                    tipo: tipoLavoro,
                    operai: stringaOperai,
                    note: note ? note : "Foglio lavoro compilato da dipendente",
                    statoIntervento: statoIntervento,
                    haBolla: document.getElementById('fotoBollaInput').files.length > 0,
                    numFotoLavori: document.getElementById('fotoLavoriInput').files.length
                });

                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
                alert(`✅ Foglio lavoro salvato! Cantiere impostato come: ${statoIntervento}.`);
            }

            document.getElementById('noteIntervento').value = '';
            document.getElementById('fotoBollaInput').value = '';
            document.getElementById('fotoLavoriInput').value = '';
            document.getElementById('previewBolla').innerHTML = '';
            document.getElementById('previewLavori').innerHTML = '';
            caricaCantieriPerOperaio();
            verificaOreMancantiPersonali(utenteCorrente);
        }
    </script>
</body>
</html>
