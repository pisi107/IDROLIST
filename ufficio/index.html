<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ufficio Idrotech Varese</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .data-folder { background: #fafafa; border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .sub-folder { margin-left: 10px; margin-top: 5px; padding: 5px; border-left: 3px solid #f28c1e; background: #fff; }
        .foto-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; }
        h2 { color: #333; }
    </style>
</head>
<body>

    <h1>Ufficio - Gestione Cantieri</h1>
    <div id="listaCantieri"></div>

    <script>
        function render() {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            const container = document.getElementById('listaCantieri');
            container.innerHTML = '';

            cantieriDB.forEach((c, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                
                let html = `<h2>📂 Cliente: ${c.cliente}</h2><p>📍 Indirizzo: ${c.indirizzo}</p>`;
                
                if (c.storico && c.storico.length > 0) {
                    c.storico.forEach(item => {
                        html += `
                        <div class="data-folder">
                            <strong>📅 Data: ${item.data}</strong> - ${item.tipo}
                            <p style="font-size: 0.9rem;">Operai: ${item.operai} | Ore: ${item.ore} | Note: ${item.note}</p>
                            
                            <div class="sub-folder">
                                <strong>📁 Foto Bolle:</strong>
                                <div class="foto-grid">${(item.fotoBolle || []).map(f => `<img src="${f}" class="thumb" onclick="window.open('${f}')">`).join('')}</div>
                            </div>
                            
                            <div class="sub-folder">
                                <strong>📁 Foto Lavori:</strong>
                                <div class="foto-grid">${(item.fotoLavori || []).map(f => `<img src="${f}" class="thumb" onclick="window.open('${f}')">`).join('')}</div>
                            </div>
                        </div>`;
                    });
                } else {
                    html += `<p>Nessun intervento registrato.</p>`;
                }
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }
        render();
    </script>
</body>
</html>
