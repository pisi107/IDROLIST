<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idrotech Varese - Gestione Ufficio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; color: #2d3748; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; margin-top: 15px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #f28c1e; color: white; border: none; border-radius: 8px; font-weight: 700; margin-top: 15px; cursor: pointer; }
        .cantiere-card { background: #fff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-top: 15px; }
        .concluso { background: #f0fdf4; border-color: #bbf7d0; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #dcfce7; color: #166534; font-weight: bold; }
        
        /* Finestra modale per la foto */
        #modalFoto { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        #modalFoto img { max-width: 100%; max-height: 85vh; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .chiudi-modal { position: absolute; top: 20px; right: 25px; background: white; color: black; border: none; font-size: 1.5rem; padding: 5px 12px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IDROTECH VARESE</h1>
        <p style="text-align:center; font-size:0.8rem; color:#64748b;">Pannello Gestione Ufficio & Storico</p>

        <label>Nome Cliente</label>
        <input type="text" id="nomeCliente" placeholder="Es. Mario Rossi">
        <label>Indirizzo Cantiere</label>
        <input type="text" id="indirizzoCantiere" placeholder="Via Roma 10, Varese">
        <button onclick="creaCantiere()">+ Crea Cartella Cantiere</button>

        <div id="listaCantieri"></div>
    </div>

    <!-- Modale per visualizzare la foto senza schermate bianche -->
    <div id="modalFoto" onclick="chiudiFoto()">
        <button class="chiudi-modal">&times;</button>
        <img id="imgVisualizzata" src="" alt="Bolla Cantiere">
    </div>

    <script>
        let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];

        function creaCantiere() {
            let cliente = document.getElementById('nomeCliente').value;
            let indirizzo = document.getElementById('indirizzoCantiere').value;
            if(!cliente) return alert("Inserisci nome cliente");
            
            cantieriDB.push({ cliente, indirizzo, stato: 'Attivo', storico: [] });
            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            render();
        }

        function mostraFoto(base64Data) {
            document.getElementById('imgVisualizzata').src = base64Data;
            document.getElementById('modalFoto').style.display = 'flex';
        }

        function chiudiFoto() {
            document.getElementById('modalFoto').style.display = 'none';
        }

        function render() {
            const container = document.getElementById('listaCantieri');
            container.innerHTML = '<h2>Cartelle Cantieri</h2>';
            
            cantieriDB.forEach((c, index) => {
                let storicoHtml = c.storico.map(item => {
                    let fotoBtn = item.foto ? `<br><button onclick='mostraFoto(${JSON.stringify(item.foto)})' style="width:auto; margin-top:6px; padding:6px 12px; background:#e0f2fe; color:#0369a1; border-radius:6px; font-size:0.8rem; border:none; font-weight:600; cursor:pointer;">📎 Visualizza Foto Bolla / Documento</button>` : '';
                    return `<div style="margin-top:10px; padding:10px; border-left:3px solid #f28c1e; background:#f9fafb;">
                        📅 <b>${item.data}</b> (${item.tipo})<br>
                        👨‍🔧 Operai: ${item.operai} | ⏱️ Ore: ${item.ore}<br>
                        📝 ${item.note}
                        ${fotoBtn}
                    </div>`;
                }).join('');

                container.innerHTML += `
                    <div class="cantiere-card ${c.stato === 'Concluso' ? 'concluso' : ''}">
                        <div style="display:flex; justify-content:space-between;">
                            <b>📂 ${c.cliente}</b>
                            <button style="width:auto; padding:2px 8px; background:#fee2e2; color:#dc2626;" onclick="rimuovi(${index})">✕</button>
                        </div>
                        <p style="margin:5px 0; font-size:0.9rem;">📍 ${c.indirizzo}</p>
                        ${c.stato === 'Concluso' ? '<span class="badge">Concluso</span>' : ''}
                        <div style="margin-top:10px;">
                            <small><b>STORICO LAVORI ESEGUITI:</b></small>
                            ${storicoHtml || '<p style="font-size:0.8rem;">Nessun lavoro registrato.</p>'}
                        </div>
                    </div>
                `;
            });
        }

        function rimuovi(index) {
            if(confirm("Eliminare questa cartella?")) {
                cantieriDB.splice(index, 1);
                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
                render();
            }
        }

        render();
    </script>
</body>
</html>
