<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idrotech Varese - Pannello Ufficio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-orange-hover: #d97712;
            --brand-dark: #2d3748;
            --danger: #dc2626;
            --bg: #0f172a;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); box-sizing: border-box; }
        .brand-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
        .brand-logo-text { font-size: 1.6rem; font-weight: 800; color: var(--brand-dark); margin: 0; }
        .brand-logo-text span { color: var(--brand-orange); }
        .brand-subtitle { font-size: 0.8rem; color: var(--text-light); font-style: italic; margin-top: 4px; }
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; color: #0f172a; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; margin-top: 10px; text-transform: uppercase; }
        input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background-color: #f8fafc; color: var(--text); box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .btn-primary { background-color: var(--brand-orange); color: white; }
        .btn-primary:hover { background-color: var(--brand-orange-hover); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        ul { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        li { background: #f8fafc; border: 1px solid var(--border); margin-bottom: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; font-size: 0.9rem; }
        .item-info { display: flex; flex-direction: column; gap: 2px; }
        .item-sub { font-size: 0.75rem; color: var(--text-light); }
        .badge { background: #ffedd5; color: #c2410c; padding: 2px 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; width: fit-content; }
        .delete-btn { background: #fee2e2; color: var(--danger); border: none; width: 30px; height: 30px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <h1 class="brand-logo-text">IDROTECH <span>VARESE</span></h1>
            <div class="brand-subtitle">Pannello Gestione Ufficio</div>
        </div>

        <h2>Aggiungi Nuovo Cantiere</h2>
        <label>Nome Cliente</label>
        <input type="text" id="nuovoCliente" placeholder="Es. Mario Rossi">

        <label>Indirizzo Cantiere</label>
        <input type="text" id="nuovoIndirizzo" placeholder="Via Roma 10, Varese">

        <button class="btn-primary" onclick="aggiungiCantiere()">+ Invia Cantiere agli Operai</button>

        <hr>

        <h2>Cantieri Inviati e Stato</h2>
        <ul id="listaCantieriUfficio"></ul>
    </div>

    <script>
        let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];

        function aggiungiCantiere() {
            const cliente = document.getElementById('nuovoCliente').value.trim();
            const indirizzo = document.getElementById('nuovoIndirizzo').value.trim();

            if (!cliente || !indirizzo) return alert("Inserisci cliente e indirizzo!");

            cantieriDB.push({ cliente, indirizzo, stato: 'Attivo' });
            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));

            document.getElementById('nuovoCliente').value = '';
            document.getElementById('nuovoIndirizzo').value = '';
            renderCantieri();
            alert("Cantiere aggiunto con successo!");
        }

        function renderCantieri() {
            const ul = document.getElementById('listaCantieriUfficio');
            if (cantieriDB.length === 0) {
                ul.innerHTML = '<li style="justify-content:center; color:var(--text-light);">Nessun cantiere inserito.</li>';
                return;
            }
            ul.innerHTML = cantieriDB.map((c, i) => `
                <li>
                    <div class="item-info">
                        <strong>${c.cliente}</strong>
                        <span class="item-sub">📍 ${c.indirizzo}</span>
                        <span class="badge" style="background:${c.stato === 'Concluso' ? '#dcfce7' : '#ffedd5'}; color:${c.stato === 'Concluso' ? '#16a34a' : '#c2410c'};">${c.stato}</span>
                    </div>
                    <button class="delete-btn" onclick="rimuovi(${i})">✕</button>
                </li>
            `).join('');
        }

        function rimuovi(i) {
            if(confirm("Eliminare cantiere?")) {
                cantieriDB.splice(i, 1);
                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
                renderCantieri();
            }
        }

        window.onload = renderCantieri;
    </script>
</body>
</html>
