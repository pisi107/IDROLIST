<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idrotech Varese - Pannello Ufficio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0b0f19;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        
        .header-app { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 25px 20px 20px 20px; text-align: center; border-bottom: 4px solid var(--brand-orange); }
        .header-app h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .header-app h1 span { color: var(--brand-orange); }
        .header-app p { font-size: 0.75rem; color: #94a3b8; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .content-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; background-color: #f8fafc; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
        input[type="date"] { appearance: none; -webkit-appearance: none; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .btn-green { background-color: var(--success); color: white; }
        .btn-orange { background: linear-gradient(135deg, #f28c1e, #d97712); color: white; }
        .btn-danger { background-color: var(--danger); color: white; padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; box-shadow: none; width: auto; }

        .card-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .cantiere-card { background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .cantiere-card.terminato { border-color: var(--success); background: #f0fdf4; }
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-da-fare { background: #fef3c7; color: #b45309; }
        .badge-fatto { background: #dcfce7; color: #15803d; }

        /* Stili per le cartelle / tab */
        .tabs-container { display: flex; gap: 8px; margin-bottom: 8px; }
        .tab-btn { flex: 1; padding: 12px; border: 2px solid var(--border); background: #f1f5f9; font-weight: 700; font-size: 0.85rem; border-radius: 10px; cursor: pointer; color: var(--text-light); text-align: center; }
        .tab-btn.active-da-fare { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        .tab-btn.active-terminati { background: #dcfce7; border-color: var(--success); color: #15803d; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-app">
            <h1>IDROTECH <span>VARESE</span></h1>
            <p>Pannello Gestione Ufficio</p>
        </div>

        <div class="content-body">
            <!-- SEZIONE INSERIMENTO RAPIDO UFFICIO PER CONTO DIPENDENTE -->
            <div class="card-box" style="border-color: var(--brand-orange);">
                <div style="font-size: 1.05rem; font-weight: 800; color: var(--brand-dark);">Registrazione per conto Dipendente</div>
                <div>
                    <label>Seleziona Dipendente</label>
                    <select id="selectDipendenteUfficio">
                        <option value="Assali Luca">Assali Luca</option>
                        <option value="Bruno Nicola">Bruno Nicola</option>
                        <option value="Comolli Alessandro">Comolli Alessandro</option>
                        <option value="Concato Filippo">Concato Filippo</option>
                        <option value="Coriglione Alessandro">Coriglione Alessandro</option>
                        <option value="De Bosio Marcello">De Bosio Marcello</option>
                        <option value="Denti Claudio">Denti Claudio</option>
                        <option value="Doda Enjo">Doda Enjo</option>
                        <option value="Giaccone Federico">Giaccone Federico</option>
                        <option value="Gjyly Moris">Gjyly Moris</option>
                        <option value="Marinoni Alessandro">Marinoni Alessandro</option>
                        <option value="Rocchetto Fabio">Rocchetto Fabio</option>
                        <option value="Rosini Jean Paul">Rosini Jean Paul</option>
                        <option value="Saleh Mohamed">Saleh Mohamed</option>
                    </select>
                </div>
                <div>
                    <label>Seleziona Cantiere</label>
                    <select id="selectCantiereUfficio"></select>
                </div>
                <div>
                    <label>Data Intervento</label>
                    <input type="date" id="dataInterventoUfficio">
                </div>
                <div>
                    <label>Ore Lavorate</label>
                    <select id="oreInterventoUfficio">
                        <!-- Popolato via JS da 0.5 a 10 ore -->
                    </select>
                </div>
                <div>
                    <label>Note / Lavori Eseguiti / Materiali</label>
                    <textarea id="noteUfficio" rows="2" placeholder="Inserisci dettagli..."></textarea>
                </div>
                <button class="action-btn btn-orange" onclick="registraUfficioPerDipendente()">Registra per conto del Dipendente</button>
            </div>

            <!-- SEZIONE CREA NUOVO CANTIERE -->
            <div class="card-box">
                <div style="font-size: 1.05rem; font-weight: 800; color: var(--brand-dark);">Inserisci Nuovo Cantiere</div>
                <div>
                    <label>Nome Cliente</label>
                    <input type="text" id="nuovoCliente" placeholder="Es. Mario Rossi">
                </div>
                <div>
                    <label>Indirizzo Cantiere</label>
                    <input type="text" id="nuovoIndirizzo" placeholder="Es. Via Roma 10, Varese">
                </div>
                <button class="action-btn btn-green" onclick="creaCantiereUfficio()">Crea Cantiere</button>
            </div>

            <!-- SEZIONE CARTELLE CANTIERI (DA TERMINARE / TERMINATI) -->
            <div class="card-box">
                <div style="font-size: 1.05rem; font-weight: 800; color: var(--brand-dark);">Archivio Cantieri</div>
                
                <!-- Bottoni Tab Cartelle -->
                <div class="tabs-container">
                    <button id="btnTabDaFare" class="tab-btn active-da-fare" onclick="cambiaCartella('da_fare')">📁 Da Terminare</button>
                    <button id="btnTabTerminati" class="tab-btn" onclick="cambiaCartella('terminati')">📁 Lavori Terminati</button>
                </div>

                <div id="listaCantieriUfficio"></div>
            </div>
        </div>
    </div>

    <script>
        let cartellaCorrente = 'da_fare'; // 'da_fare' oppure 'terminati'

        window.onload = function() {
            document.getElementById('dataInterventoUfficio').value = new Date().toISOString().split('T')[0];
            popolaSelectOreUfficio();
            aggiornaVistaUfficio();
        };

        function popolaSelectOreUfficio() {
            let select = document.getElementById('oreInterventoUfficio');
            if (!select) return;
            select.innerHTML = '';
            for (let i = 0.5; i <= 10; i += 0.5) {
                let selected = (i === 8) ? 'selected' : '';
                select.innerHTML += `<option value="${i}" ${selected}>${i} ${i === 1 ? 'Ora' : 'Ore'}</option>`;
            }
        }

        function cambiaCartella(tipo) {
            cartellaCorrente = tipo;
            let btnDaFare = document.getElementById('btnTabDaFare');
            let btnTerminati = document.getElementById('btnTabTerminati');

            if (tipo === 'da_fare') {
                btnDaFare.className = "tab-btn active-da-fare";
                btnTerminati.className = "tab-btn";
            } else {
                btnDaFare.className = "tab-btn";
                btnTerminati.className = "tab-btn active-terminati";
            }
            aggiornaVistaUfficio();
        }

        function creaCantiereUfficio() {
            let cliente = document.getElementById('nuovoCliente').value.trim();
            let indirizzo = document.getElementById('nuovoIndirizzo').value.trim();

            if(!cliente || !indirizzo) return alert("Inserisci nome cliente e indirizzo!");

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            cantieriDB.push({
                cliente: cliente,
                indirizzo: indirizzo,
                completato: false,
                storico: []
            });

            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            document.getElementById('nuovoCliente').value = '';
            document.getElementById('nuovoIndirizzo').value = '';
            
            aggiornaVistaUfficio();
            alert("✅ Cantiere creato con successo!");
        }

        function aggiornaVistaUfficio() {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let selectCantiere = document.getElementById('selectCantiereUfficio');
            let containerLista = document.getElementById('listaCantieriUfficio');

            selectCantiere.innerHTML = '';
            containerLista.innerHTML = '';

            if (cantieriDB.length === 0) {
                selectCantiere.innerHTML = '<option value="">Nessun cantiere disponibile</option>';
                containerLista.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-light); text-align: center; padding: 10px;">Nessun cantiere inserito nel database.</div>';
                return;
            }

            let cantieriFiltratiCount = 0;

            cantieriDB.forEach((c, idx) => {
                // Popola sempre la select rapida per inserire ore
                selectCantiere.innerHTML += `<option value="${idx}">${c.cliente} - ${c.indirizzo} (${c.completato ? 'Terminato' : 'Da terminare'})</option>`;

                // Filtra in base alla cartella attiva
                let isCompletato = c.completato === true;
                if ((cartellaCorrente === 'da_fare' && !isCompletato) || (cartellaCorrente === 'terminati' && isCompletato)) {
                    cantieriFiltratiCount++;

                    let storicoHtml = '';
                    if (c.storico && c.storico.length > 0) {
                        c.storico.forEach((s) => {
                            storicoHtml += `
                                <div style="font-size: 0.8rem; background: #f1f5f9; padding: 8px; border-radius: 6px; margin-top: 4px;">
                                    <b>${s.data}</b> - ${s.operai}<br>
                                    <i>Note: ${s.note}</i>
                                </div>
                            `;
                        });
                    } else {
                        storicoHtml = '<div style="font-size: 0.75rem; color: var(--text-light);">Nessun intervento registrato.</div>';
                    }

                    let badgeStato = isCompletato ? '<span class="badge badge-fatto">Terminato</span>' : '<span class="badge badge-da-fare">Da terminare</span>';
                    let btnStatoTesto = isCompletato ? 'Segna come Da Terminare' : 'Segna come Terminato';
                    let classeCard = isCompletato ? 'cantiere-card terminato' : 'cantiere-card';
                    let btnStatoClasse = isCompletato ? 'action-btn btn-green' : 'action-btn btn-orange';

                    containerLista.innerHTML += `
                        <div class="${classeCard}">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div>
                                    <div style="font-weight: 800; font-size: 1rem; color: var(--brand-dark);">${c.cliente}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-light);">${c.indirizzo}</div>
                                </div>
                                ${badgeStato}
                            </div>
                            <div style="font-size: 0.8rem; font-weight: 700; color: var(--brand-orange);">Totale Interventi Registrati: ${c.storico ? c.storico.length : 0}</div>
                            <div style="margin-top: 5px;">
                                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px;">Storico Rapportini:</div>
                                ${storicoHtml}
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 10px;">
                                <button class="${btnStatoClasse}" style="padding: 8px; font-size: 0.8rem;" onclick="cambiaStatoCantiere(${idx})">${btnStatoTesto}</button>
                                <button class="action-btn btn-danger" onclick="eliminaCantiere(${idx})">Elimina</button>
                            </div>
                        </div>
                    `;
                }
            });

            if (cantieriFiltratiCount === 0) {
                containerLista.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-light); text-align: center; padding: 15px;">Nessun cantiere in questa cartella.</div>`;
            }
        }

        function registraUfficioPerDipendente() {
            let dipendente = document.getElementById('selectDipendenteUfficio').value;
            let cantiereIdx = document.getElementById('selectCantiereUfficio').value;
            let data = document.getElementById('dataInterventoUfficio').value;
            let ore = parseFloat(document.getElementById('oreInterventoUfficio').value) || 8;
            let note = document.getElementById('noteUfficio').value.trim();

            if (cantiereIdx === '') return alert("Seleziona un cantiere valido!");
            if (!data) return alert("Inserisci una data!");

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];

            if (!cantieriDB[cantiereIdx].storico) {
                cantieriDB[cantiereIdx].storico = [];
            }

            cantieriDB[cantiereIdx].storico.push({
                data: data,
                tipo: "Inserito da Ufficio",
                operai: `${dipendente} (${ore}h)`,
                note: note ? note : "Inserito dall'ufficio per conto del dipendente",
                statoIntervento: cantieriDB[cantiereIdx].completato ? "Terminato" : "Da terminare"
            });

            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            document.getElementById('noteUfficio').value = '';
            aggiornaVistaUfficio();
            alert(`✅ Registrato con successo (${ore}h) per ${dipendente} sul cantiere di ${cantieriDB[cantiereIdx].cliente}!`);
        }

        function cambiaStatoCantiere(idx) {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            cantieriDB[idx].completato = !cantieriDB[idx].completato;
            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            aggiornaVistaUfficio();
        }

        function eliminaCantiere(idx) {
            if(confirm("Sei sicuro di voler eliminare questo cantiere?")) {
                let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
                cantieriDB.splice(idx, 1);
                localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
                aggiornaVistaUfficio();
            }
        }
    </script>
</body>
</html>
