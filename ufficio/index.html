<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idrotech Varese - Gestione Ufficio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #f28c1e;
            --brand-dark: #1e293b;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0b0f19;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 600px; background: var(--card-bg); min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        
        .header-app { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 25px 20px 20px 20px; text-align: center; border-bottom: 4px solid var(--brand-orange); }
        .header-app h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .header-app h1 span { color: var(--brand-orange); }
        .header-app p { font-size: 0.75rem; color: #94a3b8; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .content-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; background-color: #f8fafc; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
        input[type="date"] { appearance: none; -webkit-appearance: none; }

        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .btn-green { background-color: var(--success); color: white; }
        .btn-orange { background: linear-gradient(135deg, #f28c1e, #d97712); color: white; }

        .card-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-app">
            <h1>IDROTECH <span>VARESE</span></h1>
            <p>Pannello Gestione Ufficio</p>
        </div>

        <div class="content-body">
            
            <!-- NUOVO: BOX INSERIMENTO TELEFONICO DIPENDENTE -->
            <div class="card-box" style="background: #fffbeb; border: 2px solid #f59e0b;">
                <div style="font-size: 1.1rem; font-weight: 800; color: #b45309; display: flex; align-items: center; gap: 8px;">
                    📞 Inserimento Telefonico Dipendente
                </div>
                <div style="font-size: 0.85rem; color: #78350f; line-height: 1.4;">
                    Usa questo modulo se il dipendente ti detta i dati al telefono per compilarli al posto suo.
                </div>
                
                <div>
                    <label>Seleziona Dipendente</label>
                    <select id="telSelezionaDipendente">
                        <option value="">-- Seleziona operaio --</option>
                        <option value="Assali Luca">Assali Luca</option>
                        <option value="Bruno Nicola">Bruno Nicola</option>
                        <option value="Comolli Alessandro">Comolli Alessandro</option>
                        <option value="Concato Filippo">Concato Filippo</option>
                        <option value="Coriglione Alessandro">Coriglione Alessandro</option>
                        <option value="De Bosio Marcello">De Bosio Marcello</option>
                        <option value="Denti Claudio">Denti Claudio</option>
                        <option value="Doda Enjo">Doda Enjo</option>
                        <option value="Giaccone Federico">Giaccone Federico</option>
                        <option value="Gjyly Moris">Gjyly Moris</option>
                        <option value="Marinoni Alessandro">Marinoni Alessandro</option>
                        <option value="Rocchetto Fabio">Rocchetto Fabio</option>
                        <option value="Rosini Jean Paul">Rosini Jean Paul</option>
                        <option value="Saleh Mohamed">Saleh Mohamed</option>
                    </select>
                </div>

                <div>
                    <label>Seleziona Cantiere</label>
                    <select id="telSelectCantiere"></select>
                </div>

                <div>
                    <label>Data Intervento</label>
                    <input type="date" id="telDataIntervento">
                </div>

                <div>
                    <label>Ore Lavorate</label>
                    <input type="number" id="telOreIntervento" value="8" min="1" max="12" step="0.5">
                </div>

                <div>
                    <label>Note / Materiali dettati</label>
                    <input type="text" id="telNoteIntervento" placeholder="Es. Lavori eseguiti e materiali usati (dettato via telefono)">
                </div>

                <button class="action-btn btn-orange" onclick="salvaInterventoTelefonico()" style="margin-top: 5px;">
                    Registra per conto del Dipendente
                </button>
            </div>

            <!-- SEZIONE ORIGINALE: CREAZIONE CANTIERE -->
            <div class="card-box">
                <div style="font-size: 1.1rem; font-weight: 800; color: var(--brand-dark);">Inserisci Nuovo Cantiere</div>
                <div>
                    <label>Nome Cliente</label>
                    <input type="text" id="nuovoCliente" placeholder="Es. Mario Rossi">
                </div>
                <div>
                    <label>Indirizzo Cantiere</label>
                    <input type="text" id="nuovoIndirizzo" placeholder="Es. Via Roma 10, Varese">
                </div>
                <button class="action-btn btn-green" onclick="aggiungiCantiereUfficio()">Crea Cantiere</button>
            </div>

            <!-- SEZIONE ORIGINALE: LISTA CANTIERI -->
            <div class="card-box">
                <div style="font-size: 1.1rem; font-weight: 800; color: var(--brand-dark);">Cantieri Attivi e Storico</div>
                <div id="listaCantieriUfficio" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Popolato via JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let campoData = document.getElementById('telDataIntervento');
            if(campoData) campoData.value = new Date().toISOString().split('T')[0];
            aggiornaInterfacciaUfficio();
        };

        function aggiornaInterfacciaUfficio() {
            caricaCantieriPerUfficioTel();
            mostraListaCantieriUfficio();
        }

        function caricaCantieriPerUfficioTel() {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let select = document.getElementById('telSelectCantiere');
            if (!select) return;
            
            select.innerHTML = '';
            if (cantieriDB.length === 0) {
                select.innerHTML = '<option value="">Nessun cantiere disponibile</option>';
                return;
            }

            cantieriDB.forEach((c, idx) => {
                select.innerHTML += `<option value="${idx}">${c.cliente} - ${c.indirizzo}</option>`;
            });
        }

        function aggiungiCantiereUfficio() {
            let cliente = document.getElementById('nuovoCliente').value.trim();
            let indirizzo = document.getElementById('nuovoIndirizzo').value.trim();

            if (!cliente || !indirizzo) {
                return alert("Compila sia il nome del cliente che l'indirizzo!");
            }

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            cantieriDB.push({
                cliente: cliente,
                indirizzo: indirizzo,
                storico: []
            });

            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));

            document.getElementById('nuovoCliente').value = '';
            document.getElementById('nuovoIndirizzo').value = '';

            alert("✅ Cantiere creato con successo!");
            aggiornaInterfacciaUfficio();
        }

        function salvaInterventoTelefonico() {
            let dipendente = document.getElementById('telSelezionaDipendente').value;
            let cantiereIdx = document.getElementById('telSelectCantiere').value;
            let data = document.getElementById('telDataIntervento').value;
            let ore = parseFloat(document.getElementById('telOreIntervento').value) || 8;
            let note = document.getElementById('telNoteIntervento').value.trim() || "Inserito da ufficio (dettatura telefonica)";

            if (!dipendente) return alert("Seleziona il dipendente!");
            if (cantiereIdx === "") return alert("Seleziona un cantiere valido!");
            if (!data) return alert("Inserisci una data valida!");

            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let assenzeDB = JSON.parse(localStorage.getItem('idra_assenze_db')) || {};

            let chiaveAssenza = `${dipendente}_${data}`;
            if (assenzeDB[chiaveAssenza]) {
                delete assenzeDB[chiaveAssenza];
                localStorage.setItem('idra_assenze_db', JSON.stringify(assenzeDB));
            }

            if (!cantieriDB[cantiereIdx].storico) {
                cantieriDB[cantiereIdx].storico = [];
            }

            cantieriDB[cantiereIdx].storico.push({
                data: data,
                tipo: "Intervento Operativo (Telefonico)",
                operai: `${dipendente} (${ore}h)`,
                note: note,
                statoIntervento: "Da terminare"
            });

            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            
            alert(`✅ Registrato con successo per ${dipendente} sul cantiere di ${cantieriDB[cantiereIdx].cliente}!`);
            document.getElementById('telNoteIntervento').value = '';
            aggiornaInterfacciaUfficio();
        }

        function mostraListaCantieriUfficio() {
            let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];
            let container = document.getElementById('listaCantieriUfficio');
            if (!container) return;

            container.innerHTML = '';
            if (cantieriDB.length === 0) {
                container.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-light);">Nessun cantiere inserito nel database.</div>';
                return;
            }

            cantieriDB.forEach((c, idx) => {
                let numInterventi = c.storico ? c.storico.length : 0;
                container.innerHTML += `
                    <div style="background: white; border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight: 700; color: var(--brand-dark);">${c.cliente}</div>
                            <div style="font-size: 0.8rem; color: var(--text-light);">${c.indirizzo}</div>
                            <div style="font-size: 0.75rem; color: var(--success); margin-top: 4px; font-weight: 600;">Interventi registrati: ${numInterventi}</div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
