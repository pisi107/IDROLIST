<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ufficio - Idrotech Varese</title>
    <style>
        :root { --brand-orange: #f28c1e; --brand-dark: #1e293b; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: var(--brand-dark); }
        
        .cantiere-card { background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-left: 6px solid var(--brand-orange); cursor: pointer; }
        .contenuto-espanso { display: none; margin-top: 15px; padding-top: 15px; border-top: 2px solid #f1f5f9; cursor: default; }
        
        .data-folder { background: #fdfdfd; border: 2px solid #e2e8f0; padding: 18px; margin-top: 18px; border-radius: 10px; }
        .sub-folder { margin: 12px 0; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; }
        .foto-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
        .thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid #cbd5e1; }
        
        .btn-del { background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        #modalFoto { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        #modalFoto img { max-width: 90%; max-height: 85vh; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📂 Gestione Cantieri Ufficio</h1>
    
    <div class="cantiere-card" style="cursor:default; border-left-color: #27ae60;">
        <h3>Nuovo Cantiere</h3>
        <input type="text" id="nomeCliente" placeholder="Nome Cliente">
        <input type="text" id="indirizzo" placeholder="Indirizzo">
        <button class="btn-add" onclick="creaCantiere()">+ Crea Cartella Cantiere</button>
    </div>

    <div id="listaCantieri"></div>
</div>

<div id="modalFoto" onclick="chiudiFoto()">
    <img id="imgVisualizzata" src="">
</div>

<script>
    let cantieriDB = JSON.parse(localStorage.getItem('idra_cantieri_db')) || [];

    function toggleCantiere(el) {
        let content = el.querySelector('.contenuto-espanso');
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function creaCantiere() {
        let cliente = document.getElementById('nomeCliente').value;
        let indirizzo = document.getElementById('indirizzo').value;
        if(!cliente) return alert("Inserisci il nome!");
        cantieriDB.push({ cliente, indirizzo, stato: 'Attivo', storico: [] });
        localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
        document.getElementById('nomeCliente').value = '';
        document.getElementById('indirizzo').value = '';
        render();
    }

    function rimuovi(i, event) {
        event.stopPropagation();
        if(confirm("Eliminare questa cartella?")) {
            cantieriDB.splice(i, 1);
            localStorage.setItem('idra_cantieri_db', JSON.stringify(cantieriDB));
            render();
        }
    }

    function mostraFoto(f, event) {
        event.stopPropagation();
        document.getElementById('imgVisualizzata').src = f;
        document.getElementById('modalFoto').style.display = 'flex';
    }

    function chiudiFoto() { document.getElementById('modalFoto').style.display = 'none'; }

    function render() {
        const container = document.getElementById('listaCantieri');
        container.innerHTML = '';
        cantieriDB.forEach((c, index) => {
            let div = document.createElement('div');
            div.className = 'cantiere-card';
            div.onclick = function() { toggleCantiere(this); };
            
            let storicoHtml = c.storico && c.storico.length > 0 ? c.storico.map(item => `
                <div class="data-folder">
                    <div style="font-weight:bold; font-size:1.1rem;">📅 Intervento: ${item.data} - ${item.tipo}</div>
                    <p>Operai: ${item.operai} | Ore: ${item.ore} | Note: ${item.note}</p>
                    <div class="sub-folder">
                        <strong>📁 Foto Bolle:</strong>
                        <div class="foto-grid">${(item.fotoBolle||[]).map(f => `<img src="${f}" class="thumb" onclick="mostraFoto('${f}', event)">`).join('')}</div>
                    </div>
                    <div class="sub-folder">
                        <strong>📁 Foto Lavori:</strong>
                        <div class="foto-grid">${(item.fotoLavori||[]).map(f => `<img src="${f}" class="thumb" onclick="mostraFoto('${f}', event)">`).join('')}</div>
                    </div>
                </div>`).join('') : '<p>Nessun intervento registrato.</p>';

            div.innerHTML = `
                <button class="btn-del" onclick="rimuovi(${index}, event)">Elimina</button>
                <h2 style="margin:0;">📂 ${c.cliente}</h2>
                <p style="color:#666; margin:5px 0;">📍 ${c.indirizzo}</p>
                <div class="contenuto-espanso">${storicoHtml}</div>`;
            container.appendChild(div);
        });
    }
    render();
</script>
</body>
</html>
